<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Metallic Blue Gradient -->
    <linearGradient id="blueMetallic" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="40%" stop-color="#0284c7"/>
      <stop offset="70%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Metallic Red Gradient -->
    <linearGradient id="redMetallic" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff6b6b"/>
      <stop offset="40%" stop-color="#dc2626"/>
      <stop offset="70%" stop-color="#991b1b"/>
      <stop offset="100%" stop-color="#450a0a"/>
    </linearGradient>

    <!-- Metallic Gold Accent Gradient -->
    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <g transform="translate(0, 10)">
    <!-- Background Shield Glow Base -->
    <path d="M 250 30 L 390 130 L 370 290 L 310 390 L 250 460 L 190 390 L 130 290 L 110 130 Z" fill="#0f172a" opacity="0.6"/>

    <!-- Left Crown Horn (Blue Metallic) -->
    <path d="M 125 130 L 145 270 L 175 250 L 175 160 L 195 160 L 195 240 L 220 220 L 220 180 L 175 140 L 175 130 Z" fill="url(#blueMetallic)" stroke="#38bdf8" stroke-width="2.5"/>

    <!-- Right Crown Horn (Blue Metallic) -->
    <path d="M 375 130 L 355 270 L 325 250 L 325 160 L 305 160 L 305 240 L 280 220 L 280 180 L 325 140 L 325 130 Z" fill="url(#blueMetallic)" stroke="#38bdf8" stroke-width="2.5"/>

    <!-- Top Forehead Crest (Blue/Teal) -->
    <path d="M 225 135 L 250 115 L 275 135 L 265 175 L 235 175 Z" fill="url(#blueMetallic)" stroke="#38bdf8" stroke-width="2"/>
    <polygon points="250,140 258,152 250,164 242,152" fill="url(#goldAccent)"/>

    <!-- Left Cheek Armor Plate (Red Metallic) -->
    <path d="M 140 285 L 180 265 L 180 375 L 140 335 Z" fill="url(#redMetallic)" stroke="#ff6b6b" stroke-width="2.5"/>

    <!-- Right Cheek Armor Plate (Red Metallic) -->
    <path d="M 360 285 L 320 265 L 320 375 L 360 335 Z" fill="url(#redMetallic)" stroke="#ff6b6b" stroke-width="2.5"/>

    <!-- Center Nose Bridge & Eye Brow Bar (Red Metallic) -->
    <path d="M 195 255 L 235 235 L 235 295 L 220 305 L 195 275 Z" fill="url(#redMetallic)" stroke="#ff6b6b" stroke-width="2"/>
    <path d="M 305 255 L 265 235 L 265 295 L 280 305 L 305 275 Z" fill="url(#redMetallic)" stroke="#ff6b6b" stroke-width="2"/>

    <!-- Center Jaw Shield (Red Metallic Main) -->
    <path d="M 235 315 L 265 315 L 280 335 L 280 395 L 250 440 L 220 395 L 220 335 Z" fill="url(#redMetallic)" stroke="#ff6b6b" stroke-width="3"/>

    <!-- Chevron Mouth Vent (Gold Accent) -->
    <path d="M 235 355 L 250 370 L 265 355 L 258 355 L 250 363 L 242 355 Z" fill="url(#goldAccent)"/>
    <path d="M 238 380 L 250 392 L 262 380 L 256 380 L 250 386 L 244 380 Z" fill="url(#goldAccent)"/>
  </g>
</svg>
